<style>

*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t);padding:12px 12px 84px}

button{font:inherit;border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:8px;padding:10px 14px;min-height:44px;cursor:pointer}

.dw{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px}.dw label{margin:0;display:flex;align-items:center;color:var(--t)}

/* hoja del puente de Drive (bloque SP) y avisos */

#toast{position:fixed;left:50%;bottom:76px;transform:translate(-50%,30px);opacity:0;background:var(--a);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:70;transition:.25s;pointer-events:none;max-width:92vw;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}
/* hoja semanal imprimible */

 @page{size:A4 landscape;margin:10mm}

 #print .it{margin:1px 0 3px}#print .it b{font-weight:600}#print .w{font-size:8pt;color:#333}
 #print .ley{margin-top:8px;font-size:8.5pt;columns:2;column-gap:20px}#print .ley p{margin:0 0 3px;break-inside:avoid}
 #print .pie{margin-top:6px;font-size:8pt;color:#555}

<div id="v"></div><div id="mod"><div id="mf"></div></div>
<div id="sh"><div id="shBody"></div></div><div id="toast"></div><div id="print"></div>
<nav><button data-a="tab" data-k="hoy">Hoy</button><button data-a="tab" data-k="med">Medicación</button><button data-a="tab" data-k="his">Historial</button><button data-a="tab" data-k="aju">Ajustes</button></nav>
<script>
'use strict';
/* ===== MEDICACIÓN 2.0 =====
   Datos en IndexedDB «medicacion» (la 1.0 usaba localStorage «med1» y una copia en window.name, que otras webs abiertas
   después en la misma pestaña podían leer). Historial con versiones de la pauta (editar no descoloca lo pasado),
   avisos por el calendario del móvil (.ics), hoja semanal imprimible, «Tomé todas» y copias cifradas en Drive
   (Seguridad solo para el puente, carpeta Apps/Backups/medicamentos).
   Modelo: S.set = horas de referencia. S.meds[] = {id,name,dose,tol,note, +pauta: f,days,dom,n,start,end,cy,cOn,cOff,rules,on,
     vdesde (desde cuándo vale la pauta actual), vers[] (pautas anteriores {desde,hasta,...}), del (retirado desde)}
   regla = {a:referencia, t:hora fija, o:minutos (+después/-antes), w:minutos sin comer, n:veces, e:cada cuántas horas}
   S.log["AAAA-MM-DD|idMed.nRegla"] = {s:'taken'|'skipped', at:'HH:MM', n:nombre, d:dosis, h:hora prevista} */
const APP='Medicación',VER='2.0.0',FN='medicacion',APPS=['Medicación'];
const ANC={wake:'Levantarse',breakfast:'Desayuno',midmorning:'Media mañana',lunch:'Comida',snack:'Merienda',dinner:'Cena',bed:'Acostarse',fixed:'Hora fija'};
const SETK=['wake','breakfast','midmorning','lunch','snack','dinner','bed'],DAYS=['D','L','M','X','J','V','S'];
const SCHED=['f','days','dom','n','start','end','cy','cOn','cOff','rules','on'];
const $=s=>document.querySelector(s);
let S,tab='hoy',sub='',BLOQ=false,RAWBAD=null,META={changes:0,lastBackup:null,mig:null,legacy:false,snooze:''},INIT=true,ideaEd=null;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const m2=t=>{const p=String(t||'00:00').split(':');return +p[0]*60+ +p[1]};
const f2=n=>{n=((n%1440)+1440)%1440;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')};
const hl=t=>f2(t)+(t>=1440?' (madrugada)':'');
const fm=n=>n%60===0?(n/60)+' h':n>60?Math.floor(n/60)+' h '+n%60+' min':n+' min';
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(k,n)=>{const p=k.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+n);return dk(d)};
const fdl=(k,o)=>{const p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('es-ES',o||{weekday:'short',day:'numeric',month:'short'})};
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>dk(new Date());
function DEF(){return{v:2,set:{wake:'07:00',breakfast:'08:00',midmorning:'11:00',lunch:'14:00',snack:'17:30',dinner:'21:00',bed:'23:00'},meds:[],log:{},notes:[],ideas:[],start:today(),cal:{dias:90,antes:0,hasta:'',firma:''},bk:{m:1,c:1}}}

/* ---------- Base de datos (IndexedDB) ---------- */
let DB=null;
function idbOpen(){return new Promise((ok,ko)=>{if(!window.indexedDB)return ko(new Error('Este navegador no tiene IndexedDB'));const r=indexedDB.open('medicacion',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{const d=r.result;d.onversionchange=()=>{d.close();alert('Hay otra versión de Medicación abierta. Cierra esta pestaña.')};ok(d)};
  r.onerror=()=>ko(r.error);r.onblocked=()=>ko(new Error('Medicación está abierta en otra pestaña. Ciérrala y recarga.'))})}
const kvGet=k=>new Promise(r=>{try{const q=DB.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result??null);q.onerror=()=>r(null)}catch(e){r(null)}});
const kvPut=(k,v)=>new Promise(r=>{try{const t=DB.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>r(true);t.onerror=t.onabort=()=>r(false)}catch(e){r(false)}});
const metaSave=()=>kvPut('meta',META);
async function save(){if(BLOQ)return;if(!INIT){META.changes=(META.changes||0)+1;metaSave()}
  if(!(await kvPut('s',JSON.parse(JSON.stringify(S)))))toast('⚠️ No se pudo guardar el último cambio')}

/* ---------- Normalizar (también convierte los datos de la 1.0) ---------- */
function norm(o){const D=DEF();o=o&&typeof o=='object'?o:D;o.v=2;o.set=o.set||{};if(o.set.coffee){o.set.midmorning=o.set.midmorning||o.set.coffee;delete o.set.coffee}
  SETK.forEach(k=>{if(!o.set[k])o.set[k]=D.set[k]});o.meds=Array.isArray(o.meds)?o.meds:[];o.log=o.log||{};o.notes=Array.isArray(o.notes)?o.notes:[];o.ideas=Array.isArray(o.ideas)?o.ideas:[];
  o.start=o.start||D.start;o.cal=Object.assign(D.cal,o.cal||{});o.bk=Object.assign(D.bk,o.bk||{});
  const nm=m=>{m.f=m.f||'d';m.days=m.days||[];m.dom=m.dom||1;m.n=m.n||2;m.start=m.start||o.start;m.end=m.end||'';m.cy=!!m.cy;m.cOn=m.cOn||3;m.cOff=m.cOff||1;m.on=m.on!==false;
    m.rules=Array.isArray(m.rules)&&m.rules.length?m.rules:[{a:'breakfast',t:'08:00',o:0,w:0,n:1,e:3}];m.rules.forEach(r=>{if(r.a==='coffee')r.a='midmorning';if(!ANC[r.a])r.a='fixed';r.n=r.n||1;r.e=r.e||3})};
  o.meds.forEach(m=>{nm(m);m.tol=m.tol||60;m.name=m.name||'';m.dose=m.dose||'';m.note=m.note||'';m.vdesde=m.vdesde||'0000-00-00';m.vers=Array.isArray(m.vers)?m.vers:[];m.vers.forEach(nm);m.del=m.del||null});
  /* registros antiguos: se les añade qué se tomó (nombre, dosis, hora prevista) para que el historial no dependa de la pauta actual */
  for(const k in o.log){const L=o.log[k];if(L&&L.n==null){const key=k.split('|')[1]||'',p=key.split('.'),m=o.meds.find(x=>x.id===p[0]);if(m){L.n=m.name;L.d=m.dose;const r=m.rules[+p[1]];if(r)L.h=f2((r.a==='fixed'?m2(r.t):m2(o.set[r.a])+(+r.o||0))+(+p[2]||0)*Math.round((+r.e||3)*60))}}}
  return o}

/* ---------- Pauta según el día (versiones) ---------- */
function plan(m,k){if(m.del&&k>=m.del)return null;for(const v of m.vers)if(k>=v.desde&&k<=v.hasta)return v;return k>=m.vdesde?m:(m.vers[0]||m)}
const dn=k=>{const p=k.split('-');return Math.round(Date.UTC(+p[0],+p[1]-1,+p[2])/864e5)};
function why(p,k){if(!p)return'retirado';if(!p.on)return'pausa';if(k<p.start||(p.end&&k>p.end))return'fechas';
  const q=k.split('-'),y=+q[0],mo=+q[1],d=+q[2];
  if(p.cy){const s=p.start.split('-'),mm=(y-s[0])*12+(mo-s[1])-(d<+s[2]?1:0),on=Math.max(1,+p.cOn||1),P=on+(+p.cOff||0);if(((mm%P)+P)%P>=on)return'descanso'}
  if(p.f==='w'&&p.days.indexOf(new Date(y,mo-1,d).getDay())<0)return'hoy no';
  if(p.f==='m'&&d!==Math.min(+p.dom||1,new Date(y,mo,0).getDate()))return'hoy no';
  if(p.f==='n'&&(dn(k)-dn(p.start))%Math.max(1,+p.n||1)!==0)return'hoy no';
  return''}
function doses(k){k=k||today();const o=[];S.meds.forEach(md=>{const p=plan(md,k);if(why(p,k))return;p.rules.forEach((r,i)=>{
  const b=r.a==='fixed'?m2(r.t||'08:00'):m2(S.set[r.a])+(+r.o||0),n=Math.max(1,+r.n||1),ev=Math.round((+r.e||3)*60);
  for(let j=0;j<n;j++)o.push({md,i,t:b+j*ev,w:+r.w||0,key:md.id+'.'+i+(j?'.'+j:''),r})})});
  return o.sort((a,b)=>a.t-b.t||a.md.name.localeCompare(b.md.name))}
function desc(r){let s;const o=+r.o||0;if(r.a==='fixed')s='A las '+esc(r.t);else s=o===0?'A las '+f2(m2(S.set[r.a]))+' ('+ANC[r.a].toLowerCase()+')':fm(Math.abs(o))+(o<0?' antes de ':' después de ')+ANC[r.a].toLowerCase();
  if((+r.n||1)>1)s+=' · '+(+r.n)+' veces, cada '+fm(Math.round((+r.e||3)*60));return s}
function sdesc(m){let s={d:'Todos los días',w:'Días: '+m.days.slice().sort((a,b)=>(a||7)-(b||7)).map(x=>DAYS[x]).join(' '),m:'Día '+(+m.dom)+' de cada mes',n:'Cada '+(+m.n)+' días'}[m.f];
  if(m.cy)s+=' · '+(+m.cOn)+' meses sí, '+(+m.cOff)+' de descanso';if(m.end)s+=' · hasta '+esc(m.end);return s}
function warn(d){if(!d.w)return'';const M=['breakfast','midmorning','lunch','snack','dinner'];
  for(const k of M){if(d.r.a===k)continue;const mt=m2(S.set[k]);if(mt>=d.t&&mt<d.t+d.w)return'Choca con '+ANC[k].toLowerCase()+' ('+esc(S.set[k])+')'}return''}
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
function due(d,k){const td=today();return k<td||(k===td&&nowMin()>d.t+(+d.md.tol||60))}
function st(d,k){const L=S.log[k+'|'+d.key];if(L)return L.s;const td=today();if(k<td)return'missed';if(k>td)return'up';const n=nowMin(),tol=+d.md.tol||60;return n>d.t+tol?'late':n>=d.t-15?'now':'up'}
function marcar(k,key,s){const d=doses(k).find(x=>x.key===key);S.log[k+'|'+key]={s,at:f2(nowMin()),n:d?d.md.name:'',d:d?d.md.dose:'',h:d?f2(d.t):''}}

/* ---------- Vistas ---------- */
let _toT;function toast(m,ms){const t=$('#toast');clearTimeout(_toT);if(!m){t.classList.remove('on');return}t.textContent=m;t.classList.add('on');_toT=setTimeout(()=>t.classList.remove('on'),Math.min(ms||2500,8000))}
function avisoCalendario(){if(!S.meds.some(m=>!m.del))return'';const c=S.cal;if(!c.hasta)return'';
  if(c.firma&&c.firma!==firmaPlan())return'<div class="banner">📅 La pauta ha cambiado desde que exportaste los avisos al calendario. <button class="sm ok" data-a="cal">Volver a exportarlos</button></div>';
  if(c.hasta<addD(today(),14))return'<div class="banner">📅 Los avisos del calendario terminan el '+fdl(c.hasta)+'. <button class="sm ok" data-a="cal">Exportar los siguientes</button></div>';return''}
function vHoy(){const k=today(),D=doses(k),n=new Date();
  if(BLOQ)return'<div class="card missed">'+(RAWBAD!=null?'<b>Los datos de la versión anterior están dañados y no se pueden leer.</b> No se ha tocado nada. <button data-a="rawdl">Descargarlos tal cual</button>':'<b>No se pudo pasar tus datos a la base nueva.</b> No se ha tocado nada y la app está en solo lectura. Avísame antes de seguir.')+'</div>';
  if(!S.meds.some(m=>!m.del))return avisoCalendario()+'<div class="card">Aún no hay medicación. Ve a <b>Medicación</b> y añade la primera.</div>';
  const done=D.filter(d=>{const L=S.log[k+'|'+d.key];return L&&L.s==='taken'}).length;
  let h=avisoCalendario()+'<div class="hd">'+n.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'})+'<br><small>'+done+' de '+D.length+' tomas hechas</small></div>';
  if(!D.length)h+='<div class="card">Hoy no hay tomas programadas.</div>';
  const G=[];D.forEach(d=>{const g=G[G.length-1];if(g&&g.t===d.t)g.l.push(d);else G.push({t:d.t,l:[d]})});
  G.forEach(g=>{const pend=g.l.filter(d=>!S.log[k+'|'+d.key]);
    h+='<div class="slot"><span class="tm">'+f2(g.t)+'</span>'+(g.t>=1440?'<small>de madrugada</small>':'')+'<span class="g">'+(g.l.length>1?g.l.length+' medicamentos':'')+'</span>'+(pend.length>1?'<button class="ok sm" data-a="takeall" data-k="'+g.t+'">✓ Tomé las '+pend.length+'</button>':'')+'</div>';
    g.l.forEach(d=>{const L=S.log[k+'|'+d.key],s=st(d,k),w=warn(d);
      h+='<div class="card '+s+'"><div class="row"><div class="g"><b>'+esc(d.md.name)+'</b> '+esc(d.md.dose)+'<br><small>'+desc(d.r)+'</small></div></div>';
      if(d.w)h+='<div class="nf">No comer hasta las '+f2(d.t+d.w)+'</div>';
      if(w)h+='<div class="wn">⚠ '+w+'</div>';
      if(d.md.note)h+='<div><small>'+esc(d.md.note)+'</small></div>';
      h+=L?'<div class="row"><span class="bd g">'+(L.s==='taken'?'Tomada a las '+esc(L.at):'Omitida')+'</span><button data-a="undo" data-k="'+esc(d.key)+'">Deshacer</button></div>'
        :'<div class="row"><button class="ok" data-a="take" data-k="'+esc(d.key)+'">Tomada</button><button data-a="skip" data-k="'+esc(d.key)+'">Omitir</button></div>'+(s==='late'?'<div class="wn">Retrasada: pasó el margen de '+fm(+d.md.tol||60)+'</div>':'');
      h+='</div>'})});
  const off=S.meds.filter(m=>{const w=why(plan(m,k),k);return w==='descanso'||w==='hoy no'});
  if(off.length)h+='<div class="card skipped"><small>Hoy no toca: '+off.map(m=>esc(m.name)+(why(plan(m,k),k)==='descanso'?' (descanso)':'')).join(', ')+'</small></div>';
  return h}

function vMed(){const act=S.meds.filter(m=>!m.del),ret=S.meds.filter(m=>m.del);
  let h='<div class="hd">Medicación</div><button class="ok" style="width:100%" data-a="new">+ Añadir medicamento</button>'
   +'<div class="row"><button class="g" data-a="hoja">🖨 Hoja semanal</button><button class="g" data-a="cal">📅 Avisos en el calendario</button></div><div style="height:10px"></div>';
  act.forEach(m=>{h+='<div class="card'+(m.on?'':' skipped')+'"><b>'+esc(m.name)+'</b> '+esc(m.dose)+(m.on?'':' <small>(en pausa)</small>')+'<br><small>'+sdesc(m)+'</small><br>';

/* tomas de un día pasado: las previstas por la pauta de ese día + las que se marcaron aunque ya no estén en ninguna pauta */
function diaResumen(k){let t=0,ok=0,sk=0;const miss=[],keys=new Set();
  doses(k).forEach(x=>{keys.add(x.key);const L=S.log[k+'|'+x.key];if(L||due(x,k)){t++;if(L&&L.s==='taken')ok++;else if(L)sk++;else miss.push(x.md.name+' '+f2(x.t))}});
  for(const kk in S.log){const p=kk.split('|');if(p[0]===k&&!keys.has(p[1])){t++;if(S.log[kk].s==='taken')ok++;else sk++}}
  return{t,ok,sk,miss}}

  h+='</div><div class="card"><b>Notas</b>';

  h+='</div><div class="card"><b>Informe para el médico</b><div class="row"><button class="ok" data-a="rep">Generar informe (30 días)</button><button data-a="repcopy">Copiar</button></div><textarea id="rp" style="min-height:160px" placeholder="Aquí aparecerá el informe; cópialo y envíalo."></textarea></div>';

function report(){const L=['INFORME DE TOMAS — '+new Date().toLocaleDateString('es-ES'),''],c={};
  eachDay(30,k=>{doses(k).forEach(x=>{const l=S.log[k+'|'+x.key];if(l||due(x,k)){const z=c[x.md.id]=c[x.md.id]||{m:x.md,t:0,ok:0,sk:0};z.t++;if(l&&l.s==='taken')z.ok++;if(l&&l.s==='skipped')z.sk++}})});
  L.push('Cumplimiento (desde '+fdl(addD(today(),-29)>S.start?addD(today(),-29):S.start,{day:'numeric',month:'short',year:'numeric'})+'):');
  Object.values(c).forEach(z=>L.push('- '+z.m.name+(z.m.dose?' ('+z.m.dose+')':'')+': '+z.ok+'/'+z.t+' ('+Math.round(100*z.ok/z.t)+'%), omitidas '+z.sk+', olvidadas '+(z.t-z.ok-z.sk)+(z.m.del?' [retirado el '+z.m.del+']':z.m.on?'':' [en pausa]')));
  if(!Object.keys(c).length)L.push('- (sin tomas en el periodo)');
  const lim=Date.now()-30*864e5,N=S.notes.filter(n=>n.ts>=lim);L.push('','Síntomas y sucesos:');
  if(!N.length)L.push('- (ninguno)');N.forEach(n=>L.push('- '+new Date(+n.ts).toLocaleString('es-ES')+(n.med?' ['+n.med+']':'')+': '+n.txt));
  L.push('','Pauta actual:');S.meds.filter(m=>!m.del).forEach(m=>L.push('- '+m.name+' '+m.dose+': '+sdesc(m).replace(/&[^;]+;/g,'')+' · '+m.rules.map(r=>desc(r)+(+r.w?' (sin comer '+fm(+r.w)+')':'')).join('; ')+(m.on?'':' [en pausa]')));
  return L.join('\n')}

function firmaPlan(){const dias=+S.cal.dias||90,r=[];let h=0;for(let i=0;i<dias;i++){const k=addD(today(),i);doses(k).forEach(d=>r.push(k+d.t+d.md.name+d.md.dose))}
  const s=r.join('|');for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return String(h)}
function icsTxt(s){return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n')}
function icsFold(l){const te2=new TextEncoder(),o=[];let cur='',n=0;for(const ch of l){const b=te2.encode(ch).length;if(n+b>73){o.push(cur);cur=' ';n=1}cur+=ch;n+=b}o.push(cur);return o.join('\r\n')}
function exportarCalendario(){const dias=+S.cal.dias||90,antes=+S.cal.antes||0,k0=today(),stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Medicacion//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Medicación'];let n=0;
  for(let i=0;i<dias;i++){const k=addD(k0,i),G={};doses(k).forEach(d=>{if(k===k0&&d.t<nowMin())return;(G[d.t]=G[d.t]||[]).push(d)});
    for(const t in G){const l=G[t],dia=+t>=1440?addD(k,Math.floor(+t/1440)):k,ymd=dia.replace(/-/g,''),hm=f2(+t).replace(':',''),fin=f2(+t+10).replace(':','');
      const tit='💊 '+(l.length>2?l.length+' medicamentos':l.map(d=>d.md.name+(d.md.dose?' '+d.md.dose:'')).join(' + '));
      const de=l.map(d=>'• '+d.md.name+(d.md.dose?' '+d.md.dose:'')+(d.md.note?' — '+d.md.note:'')).join('\n')+(l.some(d=>d.w)?'\nNo comer hasta las '+f2(Math.max(...l.map(d=>d.t+d.w))):'');
      L.push('BEGIN:VEVENT','UID:med-'+ymd+'-'+hm+'@medicacion','DTSTAMP:'+stamp,'DTSTART:'+ymd+'T'+hm+'00','DTEND:'+ymd+'T'+((+t%1440)+10>=1440?'2359':fin)+'00',
        icsFold('SUMMARY:'+icsTxt(tit)),icsFold('DESCRIPTION:'+icsTxt(de)),'BEGIN:VALARM','ACTION:DISPLAY',icsFold('DESCRIPTION:'+icsTxt(tit)),'TRIGGER:-PT'+antes+'M','END:VALARM','END:VEVENT');n++}}
  L.push('END:VCALENDAR');
  dl(new Blob([L.join('\r\n')+'\r\n'],{type:'text/calendar'}),'medicacion_avisos_'+k0+'.ics');
  S.cal.hasta=addD(k0,dias-1);S.cal.firma=firmaPlan();save();render();
  $('#mf').innerHTML='<h3 style="margin:0">📅 Avisos exportados</h3><p>'+n+' avisos, del '+fdl(k0)+' al '+fdl(S.cal.hasta)+'.</p>'
   +'<p><b>iPhone:</b> en la app Calendario crea antes un calendario llamado «Medicación» (Calendarios → Añadir calendario). Después abre el archivo descargado (Archivos → Descargas), pulsa «Añadir todo» y elige «Medicación».</p>'
   +'<p><b>Android:</b> abre el archivo con tu app de calendario (Samsung Calendar lo importa directamente). Con Google Calendar, impórtalo desde el ordenador en calendar.google.com → Configuración → Importar, eligiendo un calendario «Medicación».</p>'
   +'<p><b>Si cambia la pauta:</b> la app te avisará. Borra el calendario «Medicación» del teléfono, vuelve a crearlo e importa el archivo nuevo. Así nunca se duplican los avisos.</p><div class="row"><button class="ok" data-a="fclose">Entendido</button></div>';
  $('#mod').style.display='block'}

const newMed=()=>({id:uid(),name:'',dose:'',tol:60,note:'',on:true,f:'d',days:[],dom:1,n:2,start:today(),end:'',cy:false,cOn:3,cOff:1,rules:[{a:'breakfast',t:'08:00',o:0,w:0,n:1,e:3}],vdesde:today(),vers:[],del:null});

/* Si cambia la pauta, la anterior se guarda como versión hasta ayer: el historial pasado no cambia */
function guardarMed(nuevo){const i=S.meds.findIndex(x=>x.id===nuevo.id),hoy=today();
  if(i<0){nuevo.vdesde=nuevo.vdesde||hoy;S.meds.push(nuevo);return}
  const old=S.meds[i];
  if(JSON.stringify(pick(old,SCHED))!==JSON.stringify(pick(nuevo,SCHED))&&old.vdesde<hoy){nuevo.vers=old.vers.concat([Object.assign(pick(old,SCHED),{desde:old.vdesde,hasta:addD(hoy,-1)})]);nuevo.vdesde=hoy}
  S.meds[i]=nuevo}

async function spPrevOpen(){if(!confirm('No hay contraseña de copias para cifrar la copia previa: se descargará EN ABIERTO. Guárdala en un sitio seguro. ¿Seguir?'))return false;const now=new Date().toISOString();dl(new Blob([JSON.stringify({app:APP,ver:VER,v:1,date:now,data:await spData()})],{type:'application/json'}),`${FN}_v${VER}_PREVIA_completa_abierta_${now.slice(0,10)}.json`);return true}
async function impSp(e){const f=e.target.files[0];e.target.value='';if(!f)return;let h=null;try{const c=await spGet();h=c&&c.bp}catch(x){}await spRestoreFile(f,h)}
async function expSp(){let c;try{c=await spGet()}catch(e){return spLost()}let p=c&&c.bp;if(!p){p=await askPw('Contraseña para cifrar esta copia (apúntala)',1);if(!p)return}const r=await spPack(p);dl(r.bl,r.name);await spDone(r.now);toast('Copia cifrada descargada')}
/* 5) protocolo con el puente (idéntico a la Fase 2: POST firmado con HMAC; la clave nunca viaja) */
const hmac=async(k,m)=>hex(await crypto.subtle.sign('HMAC',await crypto.subtle.importKey('raw',te.encode(k),{name:'HMAC',hash:'SHA-256'},false,['sign']),te.encode(m)));
async function drvCall(c,a,pr,d){if(!PUV.test(c.u))throw'url';const ts=Date.now(),n=hex(rnd(16)),ps=JSON.stringify(pr||{}),dh=d?await sha(d):'',s=await hmac(c.k,['1',a,DAPP,ts,n,ps,dh].join('|'));let r,j;
try{r=await fetch(c.u,{method:'POST',body:JSON.stringify({v:1,a,app:DAPP,ts,n,ps,d:d||'',s}),redirect:'follow',credentials:'omit',referrerPolicy:'no-referrer',cache:'no-store'})}catch(e){throw'net'}
try{j=await r.json()}catch(e){throw'resp'}if(!j||!j.ok){DM=(j&&j.m)||'';throw(j&&j.e)||'int'}return j}
async function drvTry(c,a,pr,d){for(let t=0;;t++){try{return await drvCall(c,a,pr,d)}catch(e){if((e==='net'||e==='resp'||e==='busy')&&t<2){await sleep(1500*(t+1));continue}throw e}}}
const drvErr=e=>typeof e!=='string'?'Error: '+((e&&e.message)||e):({url:'La dirección del puente no es válida (debe ser https://script.google.com/…/exec).',net:'Sin conexión, o la dirección del puente no responde.',resp:'El puente no devolvió una respuesta válida. Revisa que la dirección termina en /exec y que la implementación es para «Cualquier usuario».',auth:'La clave del puente no coincide con la propiedad SECRET de Apps Script.',ts:'La hora del móvil no coincide con la de Google: activa la fecha y hora automáticas.',rep:'Petición repetida: inténtalo otra vez.',nosecret:'Al puente le falta la propiedad SECRET (o tiene menos de 16 caracteres).',busy:'El puente está ocupado: inténtalo en un minuto.',big:'Trozo demasiado grande para el puente.',app:'Nombre de carpeta no válido.',nf:'No se encontró esa copia en Drive.',sz:'Un trozo llegó incompleto: inténtalo otra vez.',miss:'La copia en Drive está incompleta: inténtalo otra vez.'}[e]||'Error del puente ('+e+(DM?': '+DM:'')+')');
async function drvPutBlob(c,bl,name,now){const t=new Date(now),z=n=>String(n).padStart(2,'0'),id=`${t.getFullYear()}-${z(t.getMonth()+1)}-${z(t.getDate())}_${z(t.getHours())}-${z(t.getMinutes())}-${z(t.getSeconds())}_v${String(VER).replace(/[^0-9A-Za-z]/g,'-')}_completa`,tot=Math.max(1,Math.ceil(bl.size/PART));
for(let i=0;i<tot;i++){toast(`Subiendo a Drive… ${i+1} de ${tot}`,6e4);const pt=bl.slice(i*PART,(i+1)*PART);await drvTry(c,'put',{id,i:i+1,sz:pt.size},b64(new Uint8Array(await pt.arrayBuffer())))}
await drvTry(c,'fin',{id,total:tot,size:bl.size,name,keep:(SP&&SP.keep)||10});return id}
async function drvGetBlob(c,it){const ps=[];for(let i=1;i<=it.t;i++){toast(`Descargando de Drive… ${i} de ${it.t}`,6e4);ps.push(ub64((await drvTry(c,'get',{id:it.id,i})).d))}const bl=new Blob(ps);if(bl.size!==it.s)throw'miss';return bl}
/* 6) acciones de Drive. Subir NO pide nada */
async function drvUp(){if(DUP)return toast('Ya hay una copia en curso');let c;try{c=await spGet()}catch(e){spLost();return drvConn()}if(!c)return drvConn();DUP=1;let wl=null;try{wl=navigator.wakeLock?await navigator.wakeLock.request('screen'):null}catch(e){}
try{toast('Preparando copia…',6e4);const{bl,now,name}=await spPack(c.bp);await drvPutBlob(c,bl,name,now);spSave({last:now});await spDone(now);render();toast('Copia subida a Drive ✓',3000)}
catch(e){toast('');alert('No se pudo subir la copia. Tus datos no han cambiado.\n'+drvErr(e))}finally{DUP=0;try{wl&&wl.release()}catch(e){}}}
async function drvConn(){let c=null;if(spOn()){try{c=await spGet()}catch(e){c=null}if(c){c=await spAuth('Cambiar los datos del puente');if(!c)return}}
show(`<h3>Conectar con Drive</h3><p class="mu">Copias en Apps/Backups/${DAPP}. Si ya tienes el puente de otra app, usa la misma dirección y clave.</p><label>Dirección del puente (termina en /exec)</label><input id="sp_u" inputmode="url" autocomplete="off" value="${esc(c?c.u:'')}" placeholder="https://script.google.com/macros/s/…/exec"><label>Clave del puente</label><input id="sp_k" type="password" autocomplete="off" placeholder="${c?'Guardada · vacía = no cambiarla':''}"><label>Contraseña de copias (cifra las copias · mínimo 8)</label><input id="sp_p" type="password" autocomplete="new-password" placeholder="${c?'Guardada · vacía = no cambiarla':''}"><input id="sp_p2" type="password" autocomplete="new-password" placeholder="Repite la contraseña de copias"><p class="mu">Apúntala: en un móvil nuevo, sin ella no se abren las copias. Puedes usar la misma en todas las apps. Nada de esto se muestra después ni viaja por la red.</p><div class="btns"><button onclick="drvSave()">Probar y guardar</button><button onclick="closeSh()">Cancelar</button></div>`)}
async function drvSave(){const o=SPC||{},u=$('#sp_u').value.trim(),k=$('#sp_k').value.trim()||o.k||'',p=$('#sp_p').value,p2=$('#sp_p2').value,bp=p||o.bp||'';
if(!PUV.test(u))return alert('La dirección debe ser la de la aplicación web: https://script.google.com/macros/s/…/exec');if(k.length<16)return alert('La clave del puente debe tener al menos 16 caracteres.');
if(p&&p.length<8)return alert('La contraseña de copias debe tener al menos 8 caracteres.');if(p&&p!==p2)return alert('Las contraseñas de copias no coinciden.');if(!bp)return alert('Falta la contraseña de copias.');
if(o.bp&&p&&p!==o.bp&&!confirm('Las copias que ya están en Drive (y las descargadas) seguirán necesitando la contraseña de copias ANTERIOR. ¿Cambiarla?'))return;
toast('Probando conexión…',6e4);try{const j=await drvTry({u,k},'ping');await spSet({u,k,bp});if(!SP.keep)spSave({keep:10});closeSh();render();toast('Conectado · '+j.folder,3000);
if(!SP.cid&&window.PublicKeyCredential&&confirm('¿Proteger con la huella los cambios de esta conexión?\n\nSolo se pedirá para cambiar los datos del puente o borrar copias de Drive. Nunca al entrar ni al subir copias.'))await spHuReg()}catch(e){toast('');alert(drvErr(e))}}
async function drvTest(){let c;try{c=await spGet()}catch(e){return spLost()}if(!c)return;toast('Probando conexión…',6e4);try{const j=await drvTry(c,'ping');toast('');alert('Conexión correcta ✓\nCarpeta en Drive: '+j.folder)}catch(e){toast('');alert(drvErr(e))}}
const drvKeep=v=>{spSave({keep:Math.max(2,Math.min(50,Math.floor(+v)||10))});toast('Guardado')};
async function drvOff(){if(!confirm('¿Desconectar Drive de este móvil? Las copias que ya están en Drive no se borran y tus datos no cambian.'))return;if(spOn()&&!await spAuth('Desconectar Drive'))return;localStorage.removeItem(SPL);SP=null;SPC=null;render()}
const drvAsk=()=>new Promise(r=>{const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#000a;z-index:80;display:flex;align-items:center;justify-content:center;padding:16px';d.innerHTML=`<div class="shb"><b>Datos del puente de Drive</b><input id="a_u" inputmode="url" autocomplete="off" placeholder="Dirección del puente (termina en /exec)"><input id="a_k" type="password" autocomplete="off" placeholder="Clave del puente"><div class="btns"><button id="ok">Continuar</button><button id="no">Cancelar</button></div></div>`;document.body.appendChild(d);const x=v=>{d.querySelectorAll('input').forEach(i=>i.value='');d.remove();r(v)};d.querySelector('#no').onclick=()=>x(null);d.querySelector('#ok').onclick=()=>{const u=d.querySelector('#a_u').value.trim(),k=d.querySelector('#a_k').value.trim();if(!PUV.test(u))return alert('La dirección debe empezar por https://script.google.com/ y terminar en /exec.');if(k.length<16)return alert('La clave del puente tiene al menos 16 caracteres.');x({u,k})}});
async function drvList(){let c=null;if(spOn()){try{c=await spGet()}catch(e){spLost()}}if(!c){c=await drvAsk();if(!c)return}
toast('Buscando copias…',6e4);try{const j=await drvTry(c,'list');DL=j.l||[];DX=c;toast('');drvShow()}catch(e){toast('');alert(drvErr(e))}}
function drvShow(){const z=DL.map((it,i)=>`<div class="card"><b>${new Date(it.d).toLocaleString('es-ES')}</b> <span class="mu">${(it.s/1048576).toLocaleString('es-ES',{maximumFractionDigits:2})} MB</span><div class="btns"><button onclick="drvPick(${i})">Restaurar</button><button onclick="drvDel(${i})">🗑 Borrar</button></div></div>`).join('');
show(`<h3>Copias en Drive</h3><p class="mu">Apps/Backups/${DAPP} · las más recientes primero</p>${z||'<p class="mu">No hay copias en Drive.</p>'}<div class="btns"><button onclick="DX=null;closeSh()">Cerrar</button></div>`)}
async function drvPick(i){const it=DL[i],c=DX;if(!it||!c||DUP)return;DUP=1;closeSh();
try{const bl=await drvGetBlob(c,it);toast('');const r=await spRestoreFile(bl,c.bp||null);
if(r&&r.ok&&!spOn()&&r.pw&&confirm('¿Guardar en este móvil la conexión con Drive (con la contraseña de copias que acabas de usar)?')){await spSet({u:c.u,k:c.k,bp:r.pw});spSave({keep:10});render()}}
catch(e){toast('');alert('No se pudo descargar la copia. No se ha tocado nada.\n'+drvErr(e))}finally{DUP=0;DX=null}}
async function drvDel(i){const it=DL[i],c=DX;if(!it||!c)return;if(spOn()&&!await spAuth('Borrar una copia de Drive'))return;if(!confirm('¿Borrar esta copia de Drive? Va a la papelera de Drive (se puede recuperar unos 30 días).'))return;try{await drvTry(c,'del',{id:it.id});DL.splice(i,1);drvShow()}catch(e){alert(drvErr(e))}}
const drvLast=()=>SP&&SP.last?new Date(SP.last).toLocaleString('es-ES'):'nunca';
function drvUI(){return `<div class="card"><b>☁️ Copia en Drive (cifrada)</b>${spOn()?`<p class="mu">Conectado. Carpeta: Apps/Backups/${DAPP} · última subida: ${drvLast()} · cambios protegidos con ${SP.cid?'huella':'la contraseña de copias'}</p><div class="btns"><button onclick="drvUp()">☁️ Subir copia ahora</button><button onclick="drvList()">Ver copias y restaurar</button></div><label>Conservar en Drive las últimas (copias)</label><input type="number" min="2" max="50" inputmode="numeric" value="${SP.keep||10}" onchange="drvKeep(this.value)"><div class="btns"><button onclick="drvTest()">Probar conexión</button><button onclick="drvConn()">Cambiar datos</button>${SP.cid?'<button onclick="spHuOff()">Quitar huella</button>':'<button onclick="spHuella()">Usar huella para cambios</button>'}<button onclick="drvOff()">Desconectar</button></div>`:`<p class="mu">Sube copias cifradas a tu Drive (Apps/Backups/${DAPP}) sin contraseñas al entrar. La conexión se guarda cifrada en este móvil.</p><div class="btns"><button onclick="drvConn()">Conectar con Drive</button><button onclick="drvList()">Restaurar desde Drive (móvil nuevo)</button></div>`}<div class="btns"><button onclick="expSp()">🔐 Descargar copia cifrada</button></div><label>Restaurar desde un archivo (.gdc o .json)</label><input type="file" onchange="impSp(event)"></div>`}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
