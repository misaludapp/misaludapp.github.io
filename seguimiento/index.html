<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Diario de Salud</title>
<style>
:root{color-scheme:light;--bg:#f6f4ef;--cd:#fff;--tx:#1f2a2e;--tx2:#667075;--ac:#2f7d6d;--act:#fff;--bd:#e3e0d8;--l1:#1d4e9e;--l2:#7b3fb0;--l3:#b3265a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14191b;--cd:#1e2528;--tx:#e8ecec;--tx2:#97a3a6;--ac:#5fc4ae;--act:#0c1a17;--bd:#2c363a;--l1:#7fb2ff;--l2:#c39bff;--l3:#ff8fb3}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14191b;--cd:#1e2528;--tx:#e8ecec;--tx2:#97a3a6;--ac:#5fc4ae;--act:#0c1a17;--bd:#2c363a;--l1:#7fb2ff;--l2:#c39bff;--l3:#ff8fb3}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px 14px 110px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:0 0 8px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.r{display:flex;gap:8px;flex-wrap:wrap}.r>*{flex:1 1 90px}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);margin:3px 0}
input[type=checkbox]{width:22px;height:22px;margin:0;flex:none}
.b{min-height:48px;padding:8px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);cursor:pointer;margin:3px 0}
.b.on,.b.p{background:var(--ac);color:var(--act);border-color:var(--ac)}
.b.e{font-size:28px;padding:4px}.b.x{flex:0 0 48px}
.m{color:var(--tx2);font-size:14px}
.ck{display:flex;gap:10px;align-items:center;padding:6px 0}
.q{border-top:1px solid var(--bd);padding:6px 0}
.pv{font-size:14px}.pv h2{margin:10px 0 4px;font-size:15px}.pv h3{margin:2px 0 4px;font-size:15px;text-decoration:underline;text-underline-offset:3px}.pv svg.ch{margin:4px 0 8px}
summary{cursor:pointer;padding:6px 0}
svg.ch{width:100%;height:auto;display:block;max-width:560px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:8px 2px;font-size:12px;color:var(--tx2)}
nav button.on{color:var(--ac);font-weight:600}nav span{display:block;font-size:22px}
textarea{resize:vertical;min-height:64px}
.r.n5{flex-wrap:nowrap;gap:6px}.r.n5>*{flex:1 1 0;min-width:0}
.b.e{font-size:26px;padding:2px 0}.b.s{min-height:38px;padding:2px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.g2>*{margin:0!important;min-width:0}
.mc{cursor:pointer;padding:10px}.mc.off{opacity:.6}
</style></head><body><main id="a"></main><nav id="n"></nav>
<script>
const VER='1.2',K='sd1',uid=()=>Math.random().toString(36).slice(2,9),today=()=>new Date().toLocaleDateString('sv');
const e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=d=>d?d.split('-').reverse().join('/'):'';
const defS=()=>({v:1,ficha:{nombre:'',nac:'',diag:'',alerg:'',cpap:'',otros:''},meds:[],
specs:[['cab','Médico de cabecera'],['neu','Neumólogo'],['tra','Traumatólogo'],['der','Dermatólogo'],['gin','Ginecólogo'],['fis','Fisioterapeuta']].map(([id,n])=>({id,n})),
pregs:[],vis:[],citas:[],dias:{},medidas:[],
segs:[['rod','Dolor de rodillas'],['hom','Dolor de hombro'],['can','Cansancio'],['res','Molestias respiratorias']].map(([id,n])=>({id,n,on:true})),
acts:[['Caminar',60],['Fit Dance',60],['Espalda Sana',60],['Yoga',60]].map(([n,m])=>({id:uid(),n,m})),mej:[],exp:''});
let S=defS(),db=null,sv=Promise.resolve();
const idb=()=>new Promise((ok,ko)=>{const r=indexedDB.open('diario-salud',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
const kv=(m,k,v)=>new Promise((ok,ko)=>{const s=db.transaction('kv',m=='r'?'readonly':'readwrite').objectStore('kv'),q=m=='r'?s.get(k):s.put(v,k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ko(q.error)});
const save=()=>{if(db)sv=sv.then(()=>kv('w','S',S)).catch(()=>{});else try{localStorage.setItem(K,JSON.stringify(S))}catch(x){}};
let tab='hoy',sub='',cur=today(),skip=0,dopen=0,mt='peso',fe='',ie='',idays=30,goal='',im='dias',idesde='',mv='',me=0;
let secs={ficha:1,meds:1,preg:1,vis:1,bien:1,dep:1,cpap:1,adh:1,med:1,det:0};
const A=document.getElementById('a'),sn=id=>(S.specs.find(s=>s.id==id)||{n:'General'}).n;
const so=v=>S.specs.map(s=>`<option value="${s.id}" ${s.id==v?'selected':''}>${e(s.n)}</option>`).join('');
const f=(c,x,k,ph,t)=>`<input type="${t||'text'}" placeholder="${ph}" value="${e(x[k])}" onchange="upd('${c}','${x.id}','${k}',this.value)">`;
const ta=(c,x,k,ph)=>`<textarea rows="2" placeholder="${ph}" onchange="upd('${c}','${x.id}','${k}',this.value)">${e(x[k])}</textarea>`;
const ck=(c,x,k,l)=>`<label class="ck"><input type="checkbox" ${x[k]?'checked':''} onchange="upd('${c}','${x.id}','${k}',this.checked)"> ${l}</label>`;
const upd=(c,id,k,v)=>{const o=S[c].find(x=>x.id==id);if(o){o[k]=v;save()}};
const updr=(c,id,k,v)=>{upd(c,id,k,v);render()};
const del=(c,id)=>{if(confirm('¿Borrar este elemento?')){S[c]=S[c].filter(x=>x.id!=id);save();render()}};
const add=(c,o)=>{S[c].push({id:uid(),...o});save();render()};
const go=t=>{tab=t;sub='';mv='';render();scrollTo(0,0)};
function render(){
 const T=[['hoy','🏠','Hoy'],['med','📈','Medidas'],['con','🩺','Consultas'],['inf','📄','Informe'],['mas','⋯','Más']];
 document.getElementById('n').innerHTML=T.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('');
 A.innerHTML=({hoy,med:vmed,con,inf,mas})[tab]();
}
/* ---------- HOY ---------- */
function sd(k,v,nr){const d=S.dias[cur]=S.dias[cur]||{};if(v===null||v==='')delete d[k];else d[k]=v;if(!Object.keys(d).length)delete S.dias[cur];save();if(!nr)render()}
const tg=(k,v)=>sd(k,((S.dias[cur]||{})[k]==v)?null:v);
function ts(k,id){const a=[...((S.dias[cur]||{})[k]||[])],i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);sd(k,a.length?a:null)}
function ss(id,n){const o={...((S.dias[cur]||{}).seg||{})};o[id]==n?delete o[id]:o[id]=n;sd('seg',Object.keys(o).length?o:null)}
function hoy(){
 const d=S.dias[cur]||{},sg=S.segs.filter(s=>s.on),dm=S.meds.filter(m=>m.act&&m.dia),nm=d.nomed||[];
 const old=!S.exp||(Date.now()-new Date(S.exp))>30*864e5,has=Object.keys(S.dias).length>3;
 return `<h1>${cur==today()?'Hoy':'Día'} <input type="date" value="${cur}" max="${today()}" style="width:auto;font-size:15px" onchange="cur=this.value||today();render()"></h1>
 ${old&&has?`<div class="c m" onclick="tab='mas';sub='copia';render()">💾 Hace tiempo que no haces una copia de seguridad. Toca aquí.</div>`:''}
 ${citasHoy()}<div class="c"><h2>¿Cómo te encuentras?</h2><div class="r n5">${['😣','😕','😐','🙂','😄'].map((x,i)=>`<button class="b e ${d.b==i+1?'on':''}" onclick="tg('b',${i+1})">${x}</button>`).join('')}</div></div>
 <div class="c"><h2>Deporte de hoy</h2><div class="g2">${S.acts.map(a=>`<button class="b ${(d.act||[]).includes(a.id)?'on':''}" onclick="ts('act','${a.id}')">${e(a.n)}</button>`).join('')||'<span class="m">Añade tus actividades en Más → Ajustes.</span>'}</div></div>
 <div class="c"><h2>CPAP esta noche</h2><div class="r">${[['t','Toda la noche'],['p','Parcial'],['n','No la usé']].map(([k,l])=>`<button class="b ${d.cpap==k?'on':''}" onclick="tg('cpap','${k}')">${l}</button>`).join('')}</div>
 <input type="number" step="0.5" min="0" max="14" placeholder="Horas de uso (opcional)" value="${e(d.h)}" onchange="sd('h',this.value,1)"></div>
 ${dm.length?`<div class="c"><h2>Medicación de hoy</h2><p style="margin:0 0 6px">${nm.length?'⚠️ Sin tomar: '+nm.map(i=>e((S.meds.find(m=>m.id==i)||{}).n)).join(', '):'✅ Se asume tomada toda la habitual.'}</p><button class="b" onclick="skip=!skip;render()">Me he saltado alguna</button>${skip?`<div class="r">${dm.map(m=>`<button class="b ${nm.includes(m.id)?'on':''}" onclick="ts('nomed','${m.id}')">${e(m.n)}</button>`).join('')}</div>`:''}</div>`:''}
 ${sg.length?`<div class="c"><details ${dopen?'open':''} ontoggle="dopen=this.open"><summary><b>Más detalle</b> <span class="m">(1 = nada, 5 = mucho)</span></summary>${sg.map(s=>`<div style="margin-top:8px">${e(s.n)}</div><div class="r n5">${[1,2,3,4,5].map(n=>`<button class="b s ${(d.seg||{})[s.id]==n?'on':''}" onclick="ss('${s.id}',${n})">${n}</button>`).join('')}</div>`).join('')}</details></div>`:''}
 <div class="c"><h2>Notas</h2><textarea rows="3" placeholder="Cualquier cosa que quieras recordar…" onchange="sd('nota',this.value,1)">${e(d.nota)}</textarea></div>`;
}
/* ---------- MEDIDAS ---------- */
/* Motor de gráficas: se dibuja con primitivas que sirven para SVG (pantalla) y PDF */
const PAL={tx:['var(--tx)','#1f2a2e'],t2:['var(--tx2)','#667075'],bd:['var(--bd)','#d9d6cc'],ac:['var(--ac)','#2f7d6d'],l1:['var(--l1)','#1d4e9e'],l2:['var(--l2)','#7b3fb0'],l3:['var(--l3)','#b3265a'],g1:['#2e9e6b','#2e9e6b'],g2:['#8bc34a','#8bc34a'],y:['#f2c230','#f2c230'],o:['#f08a24','#f08a24'],r:['#d9433b','#d9433b'],b:['#4a90d9','#4a90d9']};
const DOT=[.5,3.2],BTA=[[null,120,'g1','Óptima <120'],[120,130,'g2','Normal 120-129'],[130,140,'y','Normal-alta 130-139'],[140,160,'o','Alta 140-159'],[160,null,'r','Muy alta 160+']],
BTB=[[null,80,'g1','Óptima <80'],[80,85,'g2','Normal 80-84'],[85,90,'y','Normal-alta 85-89'],[90,100,'o','Alta 90-99'],[100,null,'r','Muy alta 100+']],
BSA=[[null,90,'r','Peligro <90'],[90,95,'y','Vigilar 90-94'],[95,null,'g1','Normal 95-100']],BPU=[[60,100,'g1','Normal en reposo 60-100']];
const CHS={peso:[{ttl:'Peso (kg)',k:'v1',nm:'Peso',c:'ac',pad:.5}],
 ten:[{ttl:'Tensión alta - sistólica (mmHg)',k:'v1',nm:'Alta',c:'l1',pad:5,bands:BTA},{ttl:'Tensión baja - diastólica (mmHg)',k:'v2',nm:'Baja',c:'l2',pad:5,bands:BTB},{ttl:'Pulso (ppm)',k:'v3',nm:'Pulso',c:'l3',pad:5,bands:BPU}],
 sat:[{ttl:'Saturación de oxígeno (%)',k:'v1',nm:'Saturación',c:'l1',pad:1,cap:100,bands:BSA},{ttl:'Pulso (ppm)',k:'v3',nm:'Pulso',c:'l3',pad:5,bands:BPU}]};
function cm(o){
 const pts=o.a.filter(x=>x[o.k]!==''&&x[o.k]!=null&&!isNaN(+x[o.k])).map(x=>({f:x.f,v:+x[o.k]})),n=pts.length;
 if(n<2)return null;
 const W=320,L=32,R=314,T=20,PH=110,B=T+PH,ys=pts.map(p=>p.v),P=[];
 const sm=ys.map((_,i)=>{const w=ys.slice(Math.max(0,i-2),i+1);return w.reduce((s,v)=>s+v,0)/w.length});
 let lo=Math.min(...ys,...sm),hi=Math.max(...ys,...sm);const pad=Math.max((hi-lo)*.15,o.pad);lo-=pad;hi+=pad;
 const st=[.5,1,2,5,10,20,50,100].find(q=>(hi-lo)/q<=5)||100;
 lo=Math.floor(lo/st)*st;hi=Math.ceil(hi/st)*st;if(o.cap!=null)hi=Math.min(hi,o.cap);
 const Y=v=>B-(v-lo)/(hi-lo)*PH,X=i=>L+6+i*(R-L-12)/(n-1);
 P.push({t:'x',x:2,y:11,s:o.ttl,z:10,b:1,c:'tx'});
 const vis=[];(o.bands||[]).forEach(([a,b,c,l])=>{const u=Math.max(a==null?-1e9:a,lo),w=Math.min(b==null?1e9:b,hi);if(u<w){P.push({t:'r',x:L,y:Y(w),w:R-L,h:Y(u)-Y(w),c,a:.22});vis.push([c,l])}});
 for(let i=0;lo+i*st<=hi+1e-9;i++){const v=lo+i*st;P.push({t:'l',x1:L,y1:Y(v),x2:R,y2:Y(v),c:'bd',w:.5});P.push({t:'x',x:L-3,y:Y(v)+3,s:String(+v.toFixed(1)),z:8,c:'t2',an:'e'})}
 P.push({t:'p',pts:ys.map((v,i)=>[X(i),Y(v)]),c:o.c,w:1.8});
 if(n<=60)ys.forEach((v,i)=>P.push({t:'c',x:X(i),y:Y(v),r:n<=30?2.6:1.8,c:o.c}));
 if(n>=3)P.push({t:'p',pts:sm.map((v,i)=>[X(i),Y(v)]),c:'tx',w:1.6,d:DOT});
 P.push({t:'x',x:L,y:B+12,s:fd(pts[0].f),z:8,c:'t2'});P.push({t:'x',x:R,y:B+12,s:fd(pts[n-1].f),z:8,c:'t2',an:'e'});
 if(n>=5)P.push({t:'x',x:X(Math.floor((n-1)/2)),y:B+12,s:fd(pts[Math.floor((n-1)/2)].f),z:8,c:'t2',an:'m'});
 const lg=[['line',o.c,o.nm]];if(n>=3)lg.push(['dot','tx','Media móvil (3 medidas)']);vis.forEach(([c,l])=>lg.push(['band',c,l]));
 let x=2,y=B+22;
 lg.forEach(([k,c,l])=>{const w=18+l.length*4.4;if(x>2&&x+w>W-2){x=2;y+=12}
  if(k=='line'){P.push({t:'l',x1:x,y1:y+4,x2:x+13,y2:y+4,c,w:1.8});P.push({t:'c',x:x+6.5,y:y+4,r:2.2,c})}
  else if(k=='dot')P.push({t:'l',x1:x,y1:y+4,x2:x+13,y2:y+4,c,w:1.6,d:DOT});
  else P.push({t:'r',x,y:y-.5,w:10,h:9,c,a:.45});
  P.push({t:'x',x:x+16,y:y+7,s:l,z:8,c:'t2'});x+=w});
 return {W,H:y+14,P,ttl:o.ttl};
}
const nn=v=>(+v).toFixed(1);
const primSvg=p=>{const c=PAL[p.c][0],da=p.d?` stroke-dasharray="${p.d.join(' ')}"`:'';
 if(p.t=='r')return `<rect x="${nn(p.x)}" y="${nn(p.y)}" width="${nn(p.w)}" height="${nn(p.h)}" fill="${c}" fill-opacity="${p.a}"/>`;
 if(p.t=='l')return `<line x1="${nn(p.x1)}" y1="${nn(p.y1)}" x2="${nn(p.x2)}" y2="${nn(p.y2)}" stroke="${c}" stroke-width="${p.w}" stroke-linecap="round"${da}/>`;
 if(p.t=='p')return `<polyline points="${p.pts.map(q=>nn(q[0])+','+nn(q[1])).join(' ')}" fill="none" stroke="${c}" stroke-width="${p.w}" stroke-linecap="round" stroke-linejoin="round"${da}/>`;
 if(p.t=='c')return `<circle cx="${nn(p.x)}" cy="${nn(p.y)}" r="${p.r}" fill="${c}"/>`;
 return `<text x="${nn(p.x)}" y="${nn(p.y)}" font-size="${p.z}" fill="${c}"${p.b?' font-weight="700"':''}${p.an=='e'?' text-anchor="end"':p.an=='m'?' text-anchor="middle"':''}>${e(p.s)}</text>`};
const svgOf=m=>`<svg viewBox="0 0 ${m.W} ${nn(m.H)}" class="ch" role="img" aria-label="${e(m.ttl)}">${m.P.map(primSvg).join('')}</svg>`;
const charts=(t,a)=>CHS[t].map(o=>({o,m:cm({...o,a})}));
const fm=x=>x.t=='peso'?x.v1+' kg':x.t=='ten'?x.v1+'/'+x.v2+(x.v3?' ('+x.v3+' ppm)':''):x.v1+'%'+(x.v3?' ('+x.v3+' ppm)':'');
function vmed(){
 const L={peso:'Peso',ten:'Tensión',sat:'Oxígeno'},a=S.medidas.filter(x=>x.t==mt).sort((p,q)=>p.f<q.f?-1:1);
 const i=(id,ph)=>`<input id="${id}" type="number" step="0.1" placeholder="${ph}">`;
 return `<h1>Medidas</h1><div class="r">${Object.keys(L).map(k=>`<button class="b ${mt==k?'on':''}" onclick="mt='${k}';render()">${L[k]}</button>`).join('')}</div>
 <div class="c"><h2>Nueva medida</h2><input id="md" type="date" value="${today()}">
 ${mt=='peso'?i('m1','Peso (kg)'):mt=='ten'?`<div class="r">${i('m1','Alta')}${i('m2','Baja')}${i('m3','Pulso')}</div>`:`<div class="r">${i('m1','Saturación %')}${i('m3','Pulso')}</div>`}
 ${mt!='peso'?'<select id="mc"><option>En reposo</option><option>Tras ejercicio</option><option>Otro</option></select>':''}
 <button class="b p" style="width:100%" onclick="addM()">Guardar</button></div>
 ${charts(mt,a).map(({o,m})=>`<div class="c">${m?svgOf(m):`<p class="m"><b>${e(o.ttl)}</b>: hacen falta al menos 2 medidas con este dato para ver la gráfica.</p>`}</div>`).join('')}${mt!='peso'?'<p class="m">Las franjas de colores son referencias generales; si tu médico te ha marcado otros objetivos, valen los suyos. Línea de puntos: media móvil.</p>':'<p class="m">Línea de puntos: media móvil (promedio de las últimas 3 medidas).</p>'}
 <div class="c">${[...a].reverse().slice(0,15).map(x=>`<div class="q r" style="align-items:center"><span style="flex:3 1 150px">${fd(x.f)} · <b>${fm(x)}</b> <span class="m">${e(x.c||'')}</span></span><button class="b x" onclick="del('medidas','${x.id}')">✕</button></div>`).join('')||'<p class="m">Aún no hay medidas.</p>'}</div>`;
}
function addM(){
 const g=id=>(document.getElementById(id)||{}).value,v1=g('m1');if(!v1)return;
 S.medidas.push({id:uid(),t:mt,f:g('md')||today(),v1:+v1,v2:+g('m2')||'',v3:+g('m3')||'',c:g('mc')||''});save();render();
}
/* ---------- CONSULTAS ---------- */
function con(){
 const P=S.pregs.filter(p=>!fe||p.esp==fe),pe=P.filter(p=>!p.ok),pd=P.filter(p=>p.ok),V=S.vis.filter(v=>!fe||v.esp==fe).sort((a,b)=>a.f<b.f?1:-1);
 const last=S.specs.map(s=>{const v=S.vis.filter(x=>x.esp==s.id).sort((a,b)=>a.f<b.f?1:-1)[0];return v?`<div>${e(s.n)}: <b>${fd(v.f)}</b></div>`:''}).join('');
 return `<h1>Consultas</h1><select onchange="fe=this.value;render()"><option value="">Todos los médicos</option>${so(fe)}</select>
 <div class="c"><h2>Preguntas para el médico</h2><label class="m" for="pe">¿Para qué médico?</label><select id="pe">${so(fe||'cab')}</select><textarea id="pq" rows="4" placeholder="Escribe tu duda…"></textarea><button class="b p" style="width:100%" onclick="addP()">Añadir pregunta</button>

 ${pd.length?`<details><summary class="m">Resueltas (${pd.length})</summary>${pd.map(p=>`<div class="q"><label class="ck"><input type="checkbox" checked onchange="updr('pregs','${p.id}','ok',false)"><span>${br(p.t)} <span class="m">· ${e(sn(p.esp))}</span></span></label>${ta('pregs',p,'r','Respuesta del médico')}<button class="b" onclick="del('pregs','${p.id}')">Borrar</button></div>`).join('')}</details>`:''}</div>

function mkpdf(items){

 ex.forEach((it,i)=>{
  if(it.ch){const h=it.ch.H*K+10;if(y-h<50){pg.push(cur2);cur2=[];y=800}const top=y-4;y-=h;it.ch.P.forEach(p=>cur2.push(primPdf(p,50,top,K)));return}
  const sz=it.b?(it.u?11:12):10,ld=it.b?(it.u?16:18):13,nx=ex[i+1],need=ld+(it.u&&nx&&nx.ch?nx.ch.H*K+10:0);
  if(y-need<50){pg.push(cur2);cur2=[];y=800}
  y-=ld;cur2.push(`0 g BT /${it.b?'F2':'F1'} ${sz} Tf 50 ${y} Td (${pe(it.s)}) Tj ET`);
  if(it.u)cur2.push(`q 0.8 w 0 G 50 ${y-3} m ${(50+it.s.length*sz*.56).toFixed(1)} ${y-3} l S Q`)});pg.push(cur2);

 pg.forEach((p,i)=>{const t=p.join('\n');o.push(`<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</Font<</F1 3 0 R/F2 4 0 R>>>>/Contents ${6+i*2} 0 R>>`);o.push(`<</Length ${t.length}>>\nstream\n${t}\nendstream`)});
 let s='%PDF-1.4\n';const off=[];
 for(let i=1;i<o.length;i++){off[i]=s.length;s+=`${i} 0 obj\n${o[i]}\nendobj\n`}
 const x=s.length;s+=`xref\n0 ${o.length}\n0000000000 65535 f \n`+off.slice(1).map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<</Size ${o.length}/Root 1 0 R>>\nstartxref\n${x}\n%%EOF`;

}

 <div class="c"><h2>Deportes y actividades</h2><p class="m">Minutos habituales por sesión (para los informes).</p>${S.acts.map(a=>row('acts',a,f('acts',a,'m','min','number'))).join('')}<button class="b" onclick="add('acts',{n:'',m:60})">+ Añadir actividad</button></div>`;

function mej(){
 return `<h1>Mejoras de la app</h1><p class="m">Apunta ideas según la vayas usando y marca las ya implementadas.</p>${[...S.mej].sort((a,b)=>(a.ok?1:0)-(b.ok?1:0)).map(m=>`<div class="c" style="${m.ok?'opacity:.6':''}"><label class="ck"><input type="checkbox" ${m.ok?'checked':''} onchange="updr('mej','${m.id}','ok',this.checked)">${m.ok?'Implementada':'Pendiente'}</label><textarea rows="${Math.max(2,String(m.t).split('\n').length+1)}" onchange="upd('mej','${m.id}','t',this.value)">${e(m.t)}</textarea><button class="b" onclick="del('mej','${m.id}')">Borrar</button></div>`).join('')}<button class="b p" style="width:100%" onclick="add('mej',{t:'',ok:false})">+ Nueva idea</button>`;
}
function copia(){
 return `<h1>Copia de seguridad</h1><div class="c"><p>Tus datos solo están en este dispositivo. Guarda una copia de vez en cuando (por ejemplo, una vez al mes) y envíatela por correo o guárdala en tu nube.</p><p class="m">Última copia: ${S.exp?fd(S.exp):'nunca'}</p><button class="b p" onclick="expo()">⬇️ Exportar datos (JSON)</button></div>
 <div class="c"><h2>Importar</h2><p class="m">Sustituye todos los datos actuales por los del archivo.</p><input type="file" accept=".json,application/json" onchange="impo(this.files[0])"><details><summary class="m">¿No funciona? Pegar el contenido</summary><textarea id="pj" rows="4"></textarea><button class="b" onclick="impt(document.getElementById('pj').value)">Importar texto</button></details></div>`;
}
async function expo(){if(await dl('diario-salud-'+today()+'.json',JSON.stringify(S,null,1))){S.exp=today();save();render()}}
const impo=f=>f&&f.text().then(impt);
function impt(t){try{const p=JSON.parse(t);if(!p.v||!p.dias)throw 0;if(confirm('Se sustituirán todos los datos actuales. ¿Continuar?')){S=Object.assign(defS(),p);save();render();alert('Datos importados')}}catch(x){alert('El archivo no es válido.')}}
function ayuda(){
 const D=(t,b)=>`<details class="c"><summary><b>${t}</b></summary>${b}</details>`;
 return `<h1>Ayuda</h1>${D('Cómo empezar','<p>1) Rellena la <b>Ficha médica</b> y <b>Mi medicación</b> (Más). 2) Cada día, en <b>Hoy</b>, toca cómo te encuentras y lo que hayas hecho: son unos segundos. 3) Antes de ir al médico, abre <b>Informe</b>.</p>')}
 ${D('Hoy','<p>Todo se guarda al tocar. Para corregir otro día, cambia la fecha de arriba. La medicación se da por tomada: solo marca lo que se te olvide. Si no registras un día, no pasa nada.</p>')}
 ${D('Medidas','<p>Apunta el peso, la tensión o el oxígeno solo cuando los midas. En tensión y oxígeno indica si fue en reposo o tras ejercicio. El pulso es opcional.</p><p><b>Gráficas:</b> el peso tiene una; la tensión tiene tres (alta, baja y pulso) y el oxígeno dos (saturación y pulso). Cada una lleva su leyenda debajo. La <b>línea de puntos</b> es la media móvil (promedio de las últimas 3 medidas): enseña la tendencia sin que un día aislado despiste.</p><p><b>Franjas de colores:</b> en tensión, verde = óptima, verde claro = normal, amarillo = normal-alta, naranja = alta y rojo = muy alta. En oxígeno, verde = normal (95 o más), amarillo = vigilar (90-94) y rojo = peligro (menos de 90). En el pulso se marca la franja normal en reposo (60-100). Son referencias generales: si tu médico o neumólogo te ha fijado otros objetivos, valen los suyos. Si te sale en rojo y te encuentras mal, pide ayuda médica.</p>')}
 ${D('Consultas','<p>Para apuntar una duda, elige primero el médico y escribe la pregunta debajo. Apunta dudas según se te ocurran y márcalas al resolverlas; las no resueltas pasan a la siguiente visita. Tras la consulta, apunta qué dijo el médico en <b>Visitas</b>.</p>')}
 ${D('Informe en PDF','<p>Elige el médico y el periodo (últimos días, desde una fecha o desde la última visita), escribe qué quieres sacar de la visita y pulsa <b>Guardar PDF</b>. En “Qué incluir” puedes quitar o añadir apartados.</p><p>En el apartado de medidas, el informe separa <b>Peso</b>, <b>Tensión</b> y <b>Oxígeno</b> (cada uno con su título subrayado), muestra sus gráficas del periodo elegido y lista las medidas sin cortarlas a mitad.</p>')}
 ${D('Ajustes','<p>En Más → Ajustes puedes cambiar los médicos, activar o desactivar síntomas y editar tus deportes.</p>')}
 ${D('Importante: copia de seguridad','<p>Los datos se guardan en el navegador de este dispositivo. En iPhone, Safari puede borrarlos si no se usa durante semanas. Exporta una copia cada mes (Más → Copia de seguridad).</p>')}`;
}
